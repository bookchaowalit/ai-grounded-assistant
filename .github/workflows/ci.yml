# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assistant:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.11" # requires-python >= 3.11; the previous CI ran 3.11
      # Stdlib-only package (no dependencies, no dev extra).
      install-command: uv pip install -e .
      # Same gates as the previous CI: unittest suite, compile + corpus lineage validation,
      # and the golden-question evaluation (including prompt-injection cases).
      test-command: make test check evaluate PYTHON=python

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
